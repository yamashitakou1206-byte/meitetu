<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>名鉄運行表示 - Web版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="backBtn">‹ 列車一覧</button>
    <div class="title">名古屋乗務区</div>
    <div class="tools">
      <button id="brightnessBtn" title="表示切替">☀</button>
      <button id="zoomOut">−</button>
      <button id="zoomIn">＋</button>
      <button id="menuBtn">⋮</button>
    </div>
  </header>

  <main class="screen">
    <section class="left">
      <div class="train-head">
        <div class="type">普通</div>
        <div class="train-meta">
          <div class="service">M <span>2両</span></div>
        </div>
      </div>

      <div class="route-row">
        <div class="labels"><div>発</div><div>着</div></div>
        <div class="stations"><div>一宮</div><div>津島</div></div>
        <div class="train-no"><strong>1980S</strong><small>列車</small></div>
      </div>

      <div class="table-wrap">
        <table id="schedule">
          <thead>
            <tr><th colspan="4">停車駅・時刻</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <aside class="right">
      <div class="start-title">乗務開始</div>
      <div class="clock-card">
        <canvas id="analog" width="170" height="170"></canvas>
        <div id="digital">00:00:00</div>
      </div>
      <div class="news-title">記事</div>
      <div class="news" id="news">
        <div>自動放送 <span>[221]</span></div>
      </div>
      <div class="status" id="status">デモ時刻表 / 最終更新 --:--:--</div>
    </aside>
  </main>

  <div class="bottom">
    <button id="refreshBtn">↻ 時刻表を更新</button>
    <button id="officialBtn">公式運行情報</button>
  </div>

<script src="app.js"></script>
</body>
</html>
